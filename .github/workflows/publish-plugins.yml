name: Lingyu CI Publish Plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/package.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        type: boolean
        default: false

env:
  NODE_VERSION: '25'
  DOTNET_VERSION: '10.0.x'

jobs:
  publish-npm:
    name: Publish to npm
    permissions:
      contents: read
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - lingyu-windows-application-icon-helper
          - lingyu-windows-bluetooth-helper
          - lingyu-windows-brightness-helper
          - lingyu-windows-volume-helper
          - lingyu-windows-fullscreen-detector
          - lingyu-windows-performance-monitor
          - lingyu-windows-processes-attacker
          - lingyu-windows-smtc-helper
          - lingyu-windows-toast-listener
          - lingyu-windows-screenshot-helper
          - lingyu-windows-wifi-helper

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: version
        shell: bash
        run: |
          curr=$(node -p "require('./plugins/${{ matrix.plugin }}/package.json').version")
          prev=$(git show HEAD~1:plugins/${{ matrix.plugin }}/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "0.0.0")
          echo "current=$curr" >> "$GITHUB_OUTPUT"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          if [ "$curr" = "$prev" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($curr), skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Version changed ($prev -> $curr), will publish."
          fi

      - name: Setup Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Setup .NET SDK
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Visual Studio Build Tools
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $installerPath = "${{ runner.temp }}\vs_buildtools.exe"
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_buildtools.exe' -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList '--quiet', '--norestart', '--nocache', '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--includeRecommended' -Wait
          Remove-Item $installerPath

      # DLL 与原生二进制都在各插件的 .gitignore 里（src/bin/、*-ctypes/bin/、build/），
      # files 字段只收录源码。publish 前必须在 CI 本地编译，否则发出去的包没有可执行组件。
      - name: Build native artifacts
        if: steps.version.outputs.skip != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        shell: pwsh
        run: |
          $scripts = (Get-Content package.json -Raw | ConvertFrom-Json).scripts
          if ($scripts.PSObject.Properties.Name -contains 'build:all') {
            npm run build:all
          } else {
            npm run build
          }
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Verify native artifacts exist
        if: steps.version.outputs.skip != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $dlls = Get-ChildItem -Path $root -Recurse -File -Include *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' -and $_.FullName -match '\\bin\\' }
          if (-not $dlls) {
            throw "No built DLL found under $root\bin - refusing to publish a package without native components."
          }
          $dlls | Select-Object -First 5 | ForEach-Object { Write-Output "artifact: $($_.FullName)" }
          Write-Output "total DLL artifacts: $($dlls.Count)"

      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        run: npm publish --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gpr:
    name: Publish to GitHub Packages
    permissions:
      contents: read
      packages: write
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - lingyu-windows-application-icon-helper
          - lingyu-windows-bluetooth-helper
          - lingyu-windows-brightness-helper
          - lingyu-windows-volume-helper
          - lingyu-windows-fullscreen-detector
          - lingyu-windows-performance-monitor
          - lingyu-windows-processes-attacker
          - lingyu-windows-smtc-helper
          - lingyu-windows-toast-listener
          - lingyu-windows-screenshot-helper
          - lingyu-windows-wifi-helper

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: version
        shell: bash
        run: |
          curr=$(node -p "require('./plugins/${{ matrix.plugin }}/package.json').version")
          prev=$(git show HEAD~1:plugins/${{ matrix.plugin }}/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "0.0.0")
          echo "current=$curr" >> "$GITHUB_OUTPUT"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          if [ "$curr" = "$prev" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($curr), skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Version changed ($prev -> $curr), will publish."
          fi

      - name: Setup Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jntmtmtm'

      - name: Setup .NET SDK
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Visual Studio Build Tools
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $installerPath = "${{ runner.temp }}\vs_buildtools.exe"
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_buildtools.exe' -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList '--quiet', '--norestart', '--nocache', '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--includeRecommended' -Wait
          Remove-Item $installerPath

      - name: Rewrite scope for GitHub Packages
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.name = $pkg.name -replace '@lingyu/', '@jntmtmtm/'
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -NoNewline

      # 与 npm job 相同：DLL 不入库，publish 前必须在 CI 本地编译。
      - name: Build native artifacts
        if: steps.version.outputs.skip != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        shell: pwsh
        run: |
          $scripts = (Get-Content package.json -Raw | ConvertFrom-Json).scripts
          if ($scripts.PSObject.Properties.Name -contains 'build:all') {
            npm run build:all
          } else {
            npm run build
          }
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Verify native artifacts exist
        if: steps.version.outputs.skip != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $dlls = Get-ChildItem -Path $root -Recurse -File -Include *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' -and $_.FullName -match '\\bin\\' }
          if (-not $dlls) {
            throw "No built DLL found under $root\bin - refusing to publish a package without native components."
          }
          $dlls | Select-Object -First 5 | ForEach-Object { Write-Output "artifact: $($_.FullName)" }
          Write-Output "total DLL artifacts: $($dlls.Count)"

      - name: Publish to GitHub Packages
        if: steps.version.outputs.skip != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        run: npm publish --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
