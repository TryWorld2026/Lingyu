name: Lingyu CI Test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'src/**'
      - 'i18n/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Typecheck
        run: npm run typecheck
      - name: Run full test suite
        run: |
          set -o pipefail
          FORCE_COLOR=0 NO_COLOR=1 npm test 2>&1 | tee full-test.log
      - name: Write run summary
        if: always()
        run: |
          {
            printf '## Lingyu test results\n\n'
            printf 'See the job steps and uploaded log for typecheck and test results.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-logs
          path: full-test.log
          if-no-files-found: warn
