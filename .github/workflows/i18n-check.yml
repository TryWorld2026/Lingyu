name: Lingyu CI i18n Completeness Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run i18n completeness check
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/check-i18n-completeness.ts 2>&1 | tee i18n-check.log
      - name: Write run summary
        if: always()
        run: printf '## Lingyu translation check\n\nSee the job output and uploaded log for results.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: i18n-check-log
          path: i18n-check.log
          if-no-files-found: warn
